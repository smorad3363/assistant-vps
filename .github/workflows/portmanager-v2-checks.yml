name: Port Manager V2 — bootstrap checks

on:
  pull_request:
    paths:
      - "portmanager-v1/**"
      - "portmanager-v2/**"
      - ".github/workflows/portmanager-v2-checks.yml"
  push:
    branches:
      - "feat/portmanager-v2-roadmap"
    paths:
      - "portmanager-v1/**"
      - "portmanager-v2/**"
      - ".github/workflows/portmanager-v2-checks.yml"

jobs:
  static-and-unit:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: V1 implementation must remain frozen; legacy URL now dispatches versions
        run: |
          git show 64842968c85f85afdad4e11c3ed4adfce65f5d22:portmanager-dashboard/install.sh | cmp - portmanager-v1/legacy-install.sh
          git diff --exit-code 64842968c85f85afdad4e11c3ed4adfce65f5d22 HEAD -- portmanager-dashboard/portmanager.sh.gz.b64
          grep -q 'v1|1)' portmanager-dashboard/install.sh
          grep -q 'v2|2|' portmanager-dashboard/install.sh
      - name: Bash parser checks
        run: |
          bash -n portmanager-dashboard/install.sh portmanager-v1/install.sh portmanager-v1/legacy-install.sh portmanager-v2/install.sh portmanager-v2/bin/portmanager2
      - name: Manifest verification
        run: cd portmanager-v2 && sha256sum --check --strict manifest.sha256
      - name: Python compilation
        run: python -m compileall -q portmanager-v2/pm2 portmanager-v2/tests
      - name: Unit tests without root/network mutation
        env:
          PYTHONPATH: portmanager-v2
        run: python -m unittest discover -s portmanager-v2/tests/unit -v
      - name: Read-only command smoke test
        run: |
          bash portmanager-v2/bin/portmanager2 --version
          bash portmanager-v2/bin/portmanager2 status --json
          bash portmanager-v2/bin/portmanager2 doctor --json
      - name: ShellCheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck portmanager-dashboard/install.sh portmanager-v1/install.sh portmanager-v1/legacy-install.sh portmanager-v2/install.sh portmanager-v2/bin/portmanager2

  integration-not-yet-enabled:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo "NOT TESTED: privileged netns/VM, coexistence and boot/recovery tests"
          echo "This job is informational and is NOT evidence that release gates C-F passed."

  install-bootstrap-ephemeral-vm:
    runs-on: ubuntu-24.04
    needs: static-and-unit
    steps:
      - uses: actions/checkout@v4
      - name: Install, reinstall and remove bootstrap on disposable GitHub VM
        env:
          REF_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # This is an ephemeral GitHub-hosted VM, NOT a user/production server.
          set -x
          if [ -e /usr/local/bin/portmanager ]; then
            v1_before="$(sha256sum /usr/local/bin/portmanager | cut -d' ' -f1)"
          else
            v1_before="ABSENT"
          fi
          sudo iptables-save | sed -E '/^# (Generated by|Completed on)/d; s/\[[0-9]+:[0-9]+\]/[0:0]/g' > "$RUNNER_TEMP/pm2-iptables-before.rules"
          sudo tc qdisc show > "$RUNNER_TEMP/pm2-qdisc-before.txt"
          sudo env PORTMANAGER2_REF="$REF_SHA" bash portmanager-v2/install.sh
          for name in portmanager2-restore.service portmanager2-sample.service portmanager2-sample.timer; do
            sudo test -f "/etc/systemd/system/$name"
            state="$(systemctl is-enabled "$name" 2>/dev/null || true)"
            case "$state" in
              disabled|static) ;;
              *) echo "Unexpected enabled V2 unit: $name ($state)" >&2; exit 1 ;;
            esac
          done
          sudo test -f /etc/portmanager2/systemd-owner.json
          sudo portmanager2 --version | grep -Fx '2.1.0-rc.1'
          sudo portmanager --version | grep -Fx '2.1.0-rc.1'
          sudo test -L /usr/local/bin/portmanager
          sudo portmanager2 doctor --json
          # Failure injection: refuse deletion if an owned unit was tampered.
          sudo sh -c 'echo "# tampered externally" >> /etc/systemd/system/portmanager2-restore.service'
          set +e
          sudo portmanager2 uninstall --yes > "$RUNNER_TEMP/pm2-tamper.out" 2>&1
          tamper_rc=$?
          set -e
          test "$tamper_rc" -eq 5
          grep -F 'E_CONFLICT' "$RUNNER_TEMP/pm2-tamper.out"
          sudo test -e /usr/local/bin/portmanager2
          sudo cp /opt/portmanager2/current/systemd/portmanager2-restore.service /etc/systemd/system/portmanager2-restore.service
          sudo systemctl daemon-reload
          # Clean reinstall must be idempotent and repair nothing unowned.
          sudo env PORTMANAGER2_REF="$REF_SHA" bash portmanager-v2/install.sh
          sudo portmanager2 uninstall --dry-run
          sudo portmanager2 uninstall --yes
          test ! -e /usr/local/bin/portmanager2
          test ! -L /usr/local/bin/portmanager2
          test ! -L /usr/local/bin/portmanager
          for name in portmanager2-restore.service portmanager2-sample.service portmanager2-sample.timer; do
            sudo test ! -e "/etc/systemd/system/$name"
          done
          sudo test ! -f /etc/portmanager2/systemd-owner.json
          sudo iptables-save | sed -E '/^# (Generated by|Completed on)/d; s/\[[0-9]+:[0-9]+\]/[0:0]/g' > "$RUNNER_TEMP/pm2-iptables-after.rules"
          sudo tc qdisc show > "$RUNNER_TEMP/pm2-qdisc-after.txt"
          diff -u "$RUNNER_TEMP/pm2-iptables-before.rules" "$RUNNER_TEMP/pm2-iptables-after.rules"
          diff -u "$RUNNER_TEMP/pm2-qdisc-before.txt" "$RUNNER_TEMP/pm2-qdisc-after.txt"
          sudo test -f /etc/portmanager2/config.json
          sudo test -f /var/lib/portmanager2/state.json
          # V2 sensitive directories intentionally deny access to normal users.
          test "$(stat -c %a /etc/portmanager2)" = 700
          test "$(stat -c %a /var/lib/portmanager2)" = 700
          if [ "$v1_before" = "ABSENT" ]; then
            test ! -e /usr/local/bin/portmanager
          else
            test "$v1_before" = "$(sha256sum /usr/local/bin/portmanager | cut -d' ' -f1)"
          fi
          echo "V2 bootstrap install/reinstall/uninstall checks PASS"

  v1-alias-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify V1 wrapper delegates the original URL and propagates failures
        run: |
          # Stub only curl: never run the original V1 installer on the CI host.
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cat > "$tmp/curl" <<'SH'
          #!/usr/bin/env bash
          printf '%s\n' "$@" > "${PM2_TEST_DIR}/curl-args"
          out=""
          while [ "$#" -gt 0 ]; do
            if [ "$1" = "-o" ]; then
              shift
              out="$1"
            fi
            shift
          done
          test -n "$out" || exit 88
          printf '#!/usr/bin/env bash\necho TEST-V1-ALIAS\nexit 37\n' > "$out"
          SH
          chmod +x "$tmp/curl"
          set +e
          sudo env PM2_TEST_DIR="$tmp" PATH="$tmp:$PATH" bash portmanager-v1/install.sh >"$tmp/out" 2>&1
          code=$?
          set -e
          test "$code" -eq 37
          grep -Fx 'TEST-V1-ALIAS' "$tmp/out"
          grep -Fx 'https://raw.githubusercontent.com/smorad3363/assistant-vps/master/portmanager-v1/legacy-install.sh' "$tmp/curl-args"
          test ! -e /usr/local/bin/portmanager2
          echo 'V1 alias contract PASS; full V1 coexistence still NOT TESTED'

  networkns-tcp-udp:
    runs-on: ubuntu-24.04
    needs: static-and-unit
    steps:
      - uses: actions/checkout@v4
      - name: Isolated IPv4 DNAT+SNAT+forward TCP/UDP namespace integration
        env:
          REF_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euxo pipefail
          echo_pid=""
          cleanup() {
            set +e
            if [ -n "$echo_pid" ]; then sudo kill "$echo_pid" 2>/dev/null; fi
            if sudo ip netns list | grep -q pm2relay; then
              sudo ip netns exec pm2relay portmanager2 uninstall --yes >/dev/null 2>&1 || true
            fi
            for ns in pm2client pm2relay pm2target; do
              sudo ip netns del "$ns" 2>/dev/null || true
            done
          }
          trap cleanup EXIT
          sudo env PORTMANAGER2_REF="$REF_SHA" bash portmanager-v2/install.sh
          sudo ip netns add pm2client
          sudo ip netns add pm2relay
          sudo ip netns add pm2target
          sudo ip link add pm2c type veth peer name pm2r0
          sudo ip link add pm2r1 type veth peer name pm2t
          sudo ip link set pm2c netns pm2client
          sudo ip link set pm2r0 netns pm2relay
          sudo ip link set pm2r1 netns pm2relay
          sudo ip link set pm2t netns pm2target
          for ns in pm2client pm2relay pm2target; do
            sudo ip -n "$ns" link set lo up
          done
          sudo ip -n pm2client addr add 198.18.0.1/24 dev pm2c
          sudo ip -n pm2relay addr add 198.18.0.2/24 dev pm2r0
          sudo ip -n pm2relay addr add 198.19.0.1/24 dev pm2r1
          sudo ip -n pm2target addr add 198.19.0.2/24 dev pm2t
          sudo ip -n pm2client link set pm2c up
          sudo ip -n pm2relay link set pm2r0 up
          sudo ip -n pm2relay link set pm2r1 up
          sudo ip -n pm2target link set pm2t up
          sudo ip -n pm2client route add default via 198.18.0.2
          sudo ip netns exec pm2relay sysctl -qw net.ipv4.ip_forward=1
          sudo ip netns exec pm2relay iptables -P FORWARD DROP
          sudo ip netns exec pm2target python3 -u portmanager-v2/tests/networkns/echo_server.py &
          echo_pid=$!
          sleep 1
          sudo ip netns exec pm2relay portmanager2 tunnel create             --name trial --listen-ip 198.18.0.2 --interface pm2r0             --protocol tcp,udp --mode ports --mapping 443:8443,2053:2053             --target-ip 198.19.0.2
          sudo ip netns exec pm2client python3 portmanager-v2/tests/networkns/client.py
          sudo ip netns exec pm2relay portmanager2 sample
          sleep 2
          sudo ip netns exec pm2client python3 portmanager-v2/tests/networkns/client.py
          sudo ip netns exec pm2relay portmanager2 sample
          sudo ip netns exec pm2relay portmanager2 report --window 1h --json |
            python3 -c 'import json,sys; d=json.load(sys.stdin)["details"]; print(d); assert d["upload_bytes"] > 0 and d["download_bytes"] > 0; assert d["coverage_seconds"] > 0'
          # Real per-port graph: record traffic mid-snapshot, check JSON
          # contains original TCP/443 and UDP/2053, read-only kernel rules.
          (
            sleep 1
            sudo ip netns exec pm2client python3 portmanager-v2/tests/networkns/client.py
          ) &
          traffic_pid=$!
          sudo ip netns exec pm2relay portmanager2 graph --refresh 3 --once --json |
            python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["window_seconds"]==600; ports={(r["protocol"],r["listen_port"]) for r in d["rows"]}; assert ("tcp",443) in ports and ("udp",2053) in ports, d; assert d["refresh_is_read_only"]'
          wait "$traffic_pid"
          sudo ip netns exec pm2relay portmanager2 tunnel apply
          test "$(sudo ip netns exec pm2relay iptables -t nat -S PREROUTING | grep -c 'pm2:owned-hook')" -eq 1
          # Simulate volatile PM2 rules disappearing at boot. Only remove the
          # known, verified V2-owned chains; NEVER flush any global table.
          sudo env PYTHONPATH=/opt/portmanager2/current ip netns exec pm2relay python3 -c '
          import json
          from pm2 import firewall
          state=json.load(open("/var/lib/portmanager2/state.json"))
          firewall.check_inventory(firewall.snapshot(),state["firewall"])
          firewall._remove(state["firewall"])
          '
          sudo ip netns exec pm2relay portmanager2 restore
          test "$(sudo ip netns exec pm2relay iptables -t nat -S PREROUTING | grep -c 'pm2:owned-hook')" -eq 1
          sudo ip netns exec pm2client python3 portmanager-v2/tests/networkns/client.py
          tunnel_id="$(sudo ip netns exec pm2relay portmanager2 tunnel list --json |
            python3 -c 'import json,sys;print(json.load(sys.stdin)["details"]["tunnels"][0]["id"])')"
          sudo ip netns exec pm2relay portmanager2 tunnel delete "$tunnel_id" --yes
          test "$(sudo ip netns exec pm2relay iptables -t nat -S PREROUTING | grep -c 'pm2:owned-hook' || true)" -eq 0
          # Protected all-except: prearm timer; forward unchanged target ports.
          sudo ip netns exec pm2relay portmanager2 tunnel create             --name guarded --listen-ip 198.18.0.2 --interface pm2r0             --protocol tcp,udp --mode all-except --exclude 22,443             --target-ip 198.19.0.2 --ack-all-ports
          pending="$(sudo python3 -c 'import json;print(json.load(open("/var/lib/portmanager2/protected.json"))["change_id"])')"
          test -n "$pending"
          sudo ip netns exec pm2client python3 -c 'import socket; c=socket.create_connection(("198.18.0.2",8443),timeout=5); c.sendall(b"all-except"); assert c.recv(2048)==b"TCP:all-except";c.close()'
          sudo ip netns exec pm2relay portmanager2 confirm "$pending"
          sudo test ! -e /var/lib/portmanager2/protected.json
          sudo ip netns exec pm2relay portmanager2 tunnel apply
          sudo ip netns exec pm2relay portmanager2 tunnel check --json |
            python3 -c 'import json,sys; d=json.load(sys.stdin)["details"]; assert d["safe"], d'
          guarded_id="$(sudo ip netns exec pm2relay portmanager2 tunnel list --json |
            python3 -c 'import json,sys;print(json.load(sys.stdin)["details"]["tunnels"][0]["id"])')"
          # Protected update intentionally NOT confirmed; manually invoke the
          # same rollback entry point the 120s timer calls.
          sudo ip netns exec pm2relay portmanager2 tunnel update "$guarded_id"             --name guarded --listen-ip 198.18.0.2 --interface pm2r0             --protocol tcp,udp --mode all-except --exclude 22,443,2053             --target-ip 198.19.0.2 --ack-all-ports
          pending="$(sudo python3 -c 'import json;print(json.load(open("/var/lib/portmanager2/protected.json"))["change_id"])')"
          sudo ip netns exec pm2relay portmanager2 rollback-pending "$pending"
          sudo test ! -e /var/lib/portmanager2/protected.json
          sudo ip netns exec pm2relay portmanager2 tunnel list --json |
            python3 -c 'import json,sys; t=json.load(sys.stdin)["details"]["tunnels"][0];assert t["exclude"]==[22,443], t'
          guarded_id="$(sudo ip netns exec pm2relay portmanager2 tunnel list --json |
            python3 -c 'import json,sys;print(json.load(sys.stdin)["details"]["tunnels"][0]["id"])')"
          sudo ip netns exec pm2relay portmanager2 tunnel delete "$guarded_id" --yes
          pending="$(sudo python3 -c 'import json;print(json.load(open("/var/lib/portmanager2/protected.json"))["change_id"])')"
          sudo ip netns exec pm2relay portmanager2 confirm "$pending"
          sudo ip netns exec pm2relay portmanager2 uninstall --yes
          echo "PASS namespace TCP/UDP SNAT reverse path and own-rule cleanup"

  coexist-v1-v2-ephemeral:
    runs-on: ubuntu-24.04
    needs: static-and-unit
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Automatically archive V1 then migrate portmanager to V2, explicitly restore original V1
        env:
          REF_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          sudo bash portmanager-v1/legacy-install.sh
          before="$(sudo sha256sum /usr/local/bin/portmanager | cut -d' ' -f1)"
          sudo crontab -l > "$RUNNER_TEMP/v1-cron-before"
          sudo iptables -t mangle -S PORTMANAGER_ACCT > "$RUNNER_TEMP/v1-acct-before"
          sudo tc qdisc show > "$RUNNER_TEMP/v1-tc-before"
          sudo find /etc/portmanager /var/lib/portmanager -type f -exec sha256sum '{}' ';' |
            sort > "$RUNNER_TEMP/v1-files-before"
          sudo env PORTMANAGER2_REF="$REF_SHA" bash portmanager-v2/install.sh
          sudo test -L /usr/local/bin/portmanager
          sudo portmanager --version | grep -Fx '2.1.0-rc.1'
          test "$before" = "$(sudo sha256sum /var/lib/portmanager2/legacy-v1/portmanager.v1 | cut -d' ' -f1)"
          sudo test -f /var/lib/portmanager2/legacy-v1/archive.json
          sudo crontab -l > "$RUNNER_TEMP/v1-cron-after-upgrade"
          ! grep -E '/usr/local/bin/portmanager (sample|apply)' "$RUNNER_TEMP/v1-cron-after-upgrade"
          sudo iptables -t mangle -S PORTMANAGER_ACCT > "$RUNNER_TEMP/v1-acct-after-upgrade"
          sudo tc qdisc show > "$RUNNER_TEMP/v1-tc-after-upgrade"
          diff -u "$RUNNER_TEMP/v1-acct-before" "$RUNNER_TEMP/v1-acct-after-upgrade"
          diff -u "$RUNNER_TEMP/v1-tc-before" "$RUNNER_TEMP/v1-tc-after-upgrade"
          sudo find /etc/portmanager /var/lib/portmanager -type f -exec sha256sum '{}' ';' |
            sort > "$RUNNER_TEMP/v1-files-after-upgrade"
          diff -u "$RUNNER_TEMP/v1-files-before" "$RUNNER_TEMP/v1-files-after-upgrade"
          # Explicit V1 selection MUST remove V2, restore original binary and cron.
          sudo env PORTMANAGER_INSTALL_REF="$REF_SHA" bash portmanager-v1/install.sh
          test ! -e /usr/local/bin/portmanager2
          test ! -L /usr/local/bin/portmanager
          test "$before" = "$(sudo sha256sum /usr/local/bin/portmanager | cut -d' ' -f1)"
          sudo crontab -l > "$RUNNER_TEMP/v1-cron-after-rollback"
          diff -u "$RUNNER_TEMP/v1-cron-before" "$RUNNER_TEMP/v1-cron-after-rollback"
          echo "PASS real archived V1 -> V2 primary command -> original V1 rollback"

  activated-v2-systemd:
    runs-on: ubuntu-24.04
    needs: static-and-unit
    steps:
      - uses: actions/checkout@v4
      - name: Enable owned units, sample, reinstall and remove without V1 writes
        env:
          REF_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          sudo env PORTMANAGER2_REF="$REF_SHA" PORTMANAGER2_ENABLE_SERVICES=1 bash portmanager-v2/install.sh
          test "$(systemctl is-enabled portmanager2-restore.service)" = enabled
          test "$(systemctl is-enabled portmanager2-sample.timer)" = enabled
          test "$(systemctl is-active portmanager2-sample.timer)" = active
          sudo test -f /etc/portmanager2/enable-restore
          sudo test -f /etc/portmanager2/enable-sample
          sudo systemctl start portmanager2-restore.service
          sudo systemctl start portmanager2-sample.service
          sudo portmanager2 doctor --json |
            python3 -c 'import json,sys;assert json.load(sys.stdin)["details"]["systemd_units"]=="installed_active"'
          sudo env PORTMANAGER2_REF="$REF_SHA" PORTMANAGER2_ENABLE_SERVICES=1 bash portmanager-v2/install.sh
          sudo portmanager2 uninstall --yes
          sudo test ! -e /etc/portmanager2/enable-restore
          sudo test ! -e /etc/portmanager2/enable-sample
          sudo test ! -e /etc/systemd/system/portmanager2-sample.timer
          echo "PASS V2 systemd activated timer/restore lifecycle and uninstall"

  watchdog-expiry-ephemeral:
    runs-on: ubuntu-24.04
    needs: static-and-unit
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Verify unconfirmed V2 change automatically rolls back after 120 seconds
        env:
          REF_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          sudo env PORTMANAGER2_REF="$REF_SHA" bash portmanager-v2/install.sh
          sudo env PYTHONPATH=/opt/portmanager2/current python3 - <<'PY'
          import json
          import os
          import time
          import uuid
          from pm2 import config, guard
          original_config=json.load(open("/etc/portmanager2/config.json"))
          original_state=json.load(open("/var/lib/portmanager2/state.json"))
          ident=str(uuid.uuid4())
          config.atomic_json(guard.PROTECTED, {
              "product": "portmanager2", "change_id": ident,
              "original_config": original_config,
              "original_state": original_state,
              "created_at": time.time(),
              "expires_at": time.time()+120,
              "desired_generation": original_config["generation"]
          })
          guard._schedule(ident)
          print("Armed actual systemd-run watchdog", ident)
          PY
          sudo test -f /var/lib/portmanager2/protected.json
          sleep 130
          if sudo test -e /var/lib/portmanager2/protected.json; then
            echo "Watchdog did not expire within 130s; dump owned timer state" >&2
            sudo systemctl list-timers --all --no-pager | grep portmanager2-rollback || true
            sudo journalctl -n 35 --no-pager | grep -E 'portmanager2-rollback|portmanager2' || true
            exit 1
          fi
          sudo portmanager2 status --json | python3 -c             'import json,sys; d=json.load(sys.stdin); assert d["ok"] and d["details"]["generation"] == 0'
          sudo portmanager2 uninstall --yes
          echo "PASS real 120-second automatic watchdog expiry without network mutation"

  v1-reinstall-v2-purge:
    runs-on: ubuntu-24.04
    needs: static-and-unit
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Refuse purge of V1 recovery archive, allow explicit V1 rollback
        env:
          REF_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          sudo bash portmanager-v1/legacy-install.sh
          before="$(sudo sha256sum /usr/local/bin/portmanager | cut -d' ' -f1)"
          sudo env PORTMANAGER2_REF="$REF_SHA" bash portmanager-v2/install.sh
          test "$(sudo portmanager --version)" = '2.1.0-rc.1'
          sudo portmanager2 uninstall --dry-run
          set +e
          sudo portmanager2 uninstall --yes --purge > "$RUNNER_TEMP/pm2-purge.out" 2>&1
          rc=$?
          set -e
          test "$rc" -eq 5
          grep -F 'rollback archive' "$RUNNER_TEMP/pm2-purge.out"
          sudo test -f /var/lib/portmanager2/legacy-v1/archive.json
          sudo env PORTMANAGER_INSTALL_REF="$REF_SHA" bash portmanager-v1/install.sh
          test "$before" = "$(sudo sha256sum /usr/local/bin/portmanager | cut -d' ' -f1)"
          test ! -e /usr/local/bin/portmanager2
          sudo test -f /var/lib/portmanager2/legacy-v1/archive.json
          echo "PASS destructive V2 purge blocked, V1 rollback and archive preserved"

  debian-12-graph-unit:
    runs-on: ubuntu-24.04
    container: debian:12
    steps:
      - name: Debian dependencies for static and graph checks
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git python3 python3-minimal ca-certificates coreutils procps iptables iproute2
      - uses: actions/checkout@v4
      - name: Compile all V2 modules and validate time-window graph on Debian
        env:
          PYTHONPATH: portmanager-v2
        run: |
          cd portmanager-v2
          sha256sum --check --strict manifest.sha256
          cd ..
          python3 -m compileall -q portmanager-v2/pm2
          python3 -m unittest discover -s portmanager-v2/tests/unit -v
          python3 portmanager-v2/bin/portmanager2 --help || bash portmanager-v2/bin/portmanager2 --version

  default-v2-explicit-v1-router:
    runs-on: ubuntu-24.04
    needs: static-and-unit
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Exact public URL semantics: V2 default, v1 archived rollback, V2 re-upgrade
        env:
          REF_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          sudo env PORTMANAGER_INSTALL_REF="$REF_SHA" bash portmanager-dashboard/install.sh v1
          before="$(sudo sha256sum /usr/local/bin/portmanager | cut -d' ' -f1)"
          sudo env PORTMANAGER_INSTALL_REF="$REF_SHA" bash portmanager-dashboard/install.sh
          sudo portmanager --version | grep -Fx '2.1.0-rc.1'
          sudo test -L /usr/local/bin/portmanager2
          test "$before" = "$(sudo sha256sum /var/lib/portmanager2/legacy-v1/portmanager.v1 | cut -d' ' -f1)"
          # With a piped installer the correct explicit argument is bash -s -- v1.
          cat portmanager-dashboard/install.sh |
            sudo env PORTMANAGER_INSTALL_REF="$REF_SHA" bash -s -- v1
          test ! -L /usr/local/bin/portmanager
          test "$before" = "$(sudo sha256sum /usr/local/bin/portmanager | cut -d' ' -f1)"
          test ! -e /usr/local/bin/portmanager2
          sudo env PORTMANAGER_INSTALL_REF="$REF_SHA" bash portmanager-dashboard/install.sh
          sudo portmanager --version | grep -Fx '2.1.0-rc.1'
          sudo portmanager2 uninstall --yes
          test ! -L /usr/local/bin/portmanager
          sudo test -f /var/lib/portmanager2/legacy-v1/archive.json
          echo "PASS V2 primary command and original V1 selection / reupgrade"

  tc-police-scheduled-ephemeral:
    runs-on: ubuntu-24.04
    needs: static-and-unit
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate real clsact per-port TC filter lifecycle on disposable veth
        env:
          PYTHONPATH: portmanager-v2
        run: |
          set -euxo pipefail
          sudo ip link add relay0 type veth peer name pm2tcpeer
          trap 'sudo ip link del relay0 2>/dev/null || true' EXIT
          sudo ip link set relay0 up
          sudo ip link set pm2tcpeer up
          sudo env PYTHONPATH="$PYTHONPATH" python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from unittest import mock
          import subprocess
          from pm2 import shaping
          tid="c7145b99-5b6c-4b76-a88f-fd0da56095ca"
          cfg={"schema_version":1,"generation":1,"tunnels":[{
             "id":tid,"enabled":True,"name":"demo","mode":"ports",
             "interface":"relay0","listen_ip":"192.0.2.2","target_ip":"198.51.100.2",
             "protocols":["tcp","udp"],
             "mapping":[{"listen_port":443,"target_port":8443}],"exclude":[]}]}
          schedule={"schema_version":1,"policies":[{
            "id":"any","port":443,"protocol":"tcp,udp","timezone":"UTC",
            "days":[0,1,2,3,4,5,6],"start":"18:00","end":"22:00",
            "download_mbps":20,"upload_mbps":10,"enabled":True}]}
          on=datetime(2026,10,9,19,tzinfo=timezone.utc)
          off=datetime(2026,10,9,12,tzinfo=timezone.utc)
          with TemporaryDirectory() as d:
            with (mock.patch.object(shaping,"STATE",Path(d)/"owned.json"),
                  mock.patch.object(shaping,"PENDING",Path(d)/"pending.json"),
                  mock.patch.object(shaping,"_V1",Path(d)/"no_v1"),
                  mock.patch.object(shaping,"schedule_load",return_value=schedule),
                  mock.patch.object(shaping.config,"load",return_value=cfg)):
              result=shaping.reconcile(on)
              assert result["active_filters"]==4,result
              assert shaping.reconcile(on)["changed"] is False
              assert shaping.reconcile(off)["active_filters"]==0
              assert shaping.reconcile(on)["active_filters"]==4
              result=shaping.remove_owned()
              assert result["changed"]
              assert not shaping.PENDING.exists()
          q=subprocess.run(["tc","qdisc","show","dev","relay0"],capture_output=True,text=True,check=True).stdout
          assert "clsact" not in q,q
          print("PASS timed per-port TCP/UDP upload/download clsact police lifecycle")
          PY
